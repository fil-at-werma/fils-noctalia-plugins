id          = "fil-at-werma/noc-todo"
name        = "Todo.txt Tasks"
version     = "0.9.1"
plugin_api  = 42
author      = "fil-at-werma"
icon        = "checklist"
description = "Display your todo.txt-cli tasks."
tags        = ["todo.txt","tasks","gtd","productivity"]
dependencies= ["todo.txt-cli"]

[[widget]]
id    = "tasks"
entry = "widget.luau"

[[panel]]
id    = "list"
entry = "panel.luau"   
width = 800
height = "content"
max_height = 600

[[setting]]
key = "todo_path"
type = "string"
label_key = "settings.todo_path.label"
description_key = "settings.todo_path.description"
default = "~/OneDrive/todo/todo.txt"
